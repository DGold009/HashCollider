name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install the project
        run: python -m pip install .

      - name: Lint
        run: python -m ruff check src tests examples

      - name: Run pytest
        run: python -m pytest

      - name: CLI smoke tests
        working-directory: ${{ runner.temp }}
        run: |
          hashcollider --version
          hashcollider --help
          python -m hashcollider algorithms
          hashcollider hash --algorithm sha256 --input "hello" > hash.txt
          cat hash.txt
          grep -q 2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824 hash.txt
          hashcollider collide --algorithm sha256 --bits 16 --generator sequential --length 32
          hashcollider verify collision.json
          hashcollider report collision.json
          test -f reports/collision-report.md
          hashcollider benchmark --algorithm sha256 --bits 16 --iterations 10
          hashcollider explain collision > /dev/null
          # Invalid input must fail cleanly with exit code 2 and no traceback.
          set +e
          hashcollider collide --algorithm sha999 2> err.txt
          code=$?
          set -e
          test "$code" -eq 2
          ! grep -q Traceback err.txt
